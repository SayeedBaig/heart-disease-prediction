services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: cardioai-api:local
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "${PORT:-8000}"
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env or the shell environment}"
      AUTO_CREATE_SCHEMA: "false"
      CLEANUP_UPLOADS_ON_STARTUP: "false"
      SQL_ECHO: "false"
    ports:
      - "${HOST_PORT:-8000}:${PORT:-8000}"
    volumes:
      - cardioai_uploads:/app/uploads
    restart: unless-stopped

volumes:
  cardioai_uploads:
